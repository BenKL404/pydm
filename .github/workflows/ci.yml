name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile
        run: python -m compileall -q pydm pydm_host.py
      - name: Command line help
        run: python -m pydm --help
      - name: Native host answers ping
        run: |
          python -c 'import json,struct,sys; m=json.dumps({"action":"ping"}).encode(); sys.stdout.buffer.write(struct.pack("<I",len(m))+m)' \
            | python pydm_host.py | tail -c +5 | python -c 'import json,sys; assert json.load(sys.stdin)["ok"]'
      - name: Install PySide6 (interface tests)
        if: matrix.python == '3.13'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install PySide6
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -v -s tests -t .

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: sh -n install.sh
      - name: ShellCheck
        run: shellcheck install.sh packaging/build-appimage.sh packaging/AppRun

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install into a temporary HOME
        run: |
          export HOME="$(mktemp -d)" PYDM_SKIP_PIP=1
          sh install.sh
          "$HOME/.local/bin/pydm" --help

  appimage:
    needs: [python, shell, install, extension]     # jamais de version publiée si un test échoue
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Qt system libraries (bundled into the AppImage)
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0
      - uses: actions/cache@v4
        with:
          path: packaging/cache
          key: appimage-${{ hashFiles('packaging/build-appimage.sh') }}
      - name: Build
        run: sh packaging/build-appimage.sh
      - name: Smoke tests
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          app="$(ls "$PWD"/dist/PyDM-*-x86_64.AppImage)"
          export HOME="$RUNNER_TEMP/h" PYDM_CONFIG_DIR="$RUNNER_TEMP/c"
          mkdir -p "$HOME"
          "$app" --help | grep -q -- --connections
          python3 -c 'import json,struct,sys; m=json.dumps({"action":"ping"}).encode(); sys.stdout.buffer.write(struct.pack("<I",len(m))+m)' \
            | "$app" --native-host chrome-extension://x/ | tail -c +5 \
            | python3 -c 'import json,sys; r=json.load(sys.stdin); assert r["ok"] and r["ytdlp"], r'
          timeout 20 "$app" || true
          test -x "$HOME/.local/share/pydm/pydm-host"
          grep -q pydm-host "$HOME/.mozilla/native-messaging-hosts/com.pydm.host.json"
          grep -q '^Exec=' "$HOME/.local/share/applications/pydm.desktop"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "PyDM ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."
          gh release upload "$GITHUB_REF_NAME" dist/*.AppImage --clobber

  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: JavaScript syntax
        run: for f in extension/*.js; do node --check "$f"; done
      - name: Manifest is valid JSON
        run: python3 -m json.tool extension/manifest.json > /dev/null
      - name: Extension IDs match install.sh
        run: |
          grep -q '"id": "pydm@local"' extension/manifest.json
          grep -q 'FIREFOX_ID="pydm@local"' install.sh
          grep -q 'com.pydm.host' extension/background.js
          grep -q 'HOST_NAME="com.pydm.host"' install.sh
      - name: pydm-extension.zip matches extension/
        run: |
          python3 - <<'EOF'
          import pathlib, sys, zipfile
          src = {p.relative_to("extension").as_posix(): p.read_bytes()
                 for p in pathlib.Path("extension").rglob("*") if p.is_file()}
          with zipfile.ZipFile("pydm-extension.zip") as z:
              packed = {n: z.read(n) for n in z.namelist() if not n.endswith("/")}
          if src != packed:
              diff = sorted(set(src) ^ set(packed)) + sorted(n for n in src.keys() & packed.keys() if src[n] != packed[n])
              sys.exit("pydm-extension.zip is out of date: " + ", ".join(diff))
          print(f"{len(src)} files match")
          EOF
