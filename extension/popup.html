<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PyDM</title>
<style>
  :root {
    --bg:#fff; --fg:#1f2024; --muted:#6b7280; --line:#e5e7eb; --card:#f4f6fa;
    --accent:#1a73e8; --accent-fg:#fff; --ok:#15803d; --err:#c2410c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#1c1e22; --fg:#e8eaed; --muted:#9aa1ab; --line:#32353c; --card:#24262b;
      --accent:#8ab4f8; --accent-fg:#16181c; --ok:#6ee7a8; --err:#fca5a5;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; width:360px; background:var(--bg); color:var(--fg);
         font:13px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }

  header { display:flex; align-items:center; gap:10px; padding:14px 16px; }
  header img { width:20px; height:20px; }
  header h1 { flex:1; margin:0; font-size:15px; font-weight:600; letter-spacing:-.01em; }
  #status { display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--muted); }
  #status::before { content:""; width:7px; height:7px; border-radius:50%; background:currentColor; }
  #status.ok { color:var(--ok); }
  #status.err { color:var(--err); }

  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 16px 14px; }
  button { font:inherit; font-weight:600; height:36px; padding:0 12px; border:1px solid transparent;
           border-radius:8px; white-space:nowrap; cursor:pointer;
           background:var(--accent); color:var(--accent-fg); }
  button.secondary { background:transparent; color:var(--fg); border-color:var(--line); }
  button:hover { filter:brightness(1.06); }
  button.secondary:hover { background:var(--card); filter:none; }

  section { padding:14px 16px; border-top:1px solid var(--line); }
  h2 { margin:0 0 10px; font-size:11px; font-weight:600; letter-spacing:.07em;
       text-transform:uppercase; color:var(--muted); }

  ul { list-style:none; margin:0; padding:0; max-height:208px; overflow:auto; }
  li { display:flex; align-items:center; gap:10px; padding:8px 10px; background:var(--card);
       border-radius:8px; }
  li + li { margin-top:6px; }
  li .info { flex:1; min-width:0; }
  li .name { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  li .meta { margin-top:1px; color:var(--muted); font-size:11px; }
  li button { height:28px; padding:0 10px; font-size:12px; }
  .empty { display:block; padding:2px 0 0; color:var(--muted); background:none; }

  .setting { display:flex; align-items:flex-start; gap:10px; padding:7px 0; cursor:pointer; }
  .setting input { width:15px; height:15px; margin:2px 0 0; accent-color:var(--accent); flex:none; }
  .setting .hint { display:block; margin-top:1px; color:var(--muted); font-size:11.5px; }
  .field { display:flex; align-items:center; justify-content:space-between; gap:12px;
           margin-top:10px; padding-top:12px; border-top:1px solid var(--line); }
  .field > span { flex:none; }
  select { font:inherit; height:30px; min-width:0; max-width:206px; padding:0 6px; color:var(--fg);
           background:var(--card); border:1px solid var(--line); border-radius:7px; cursor:pointer; }

  #help { display:none; margin:0 16px 14px; padding:10px 12px; border-radius:8px;
          background:var(--card); color:var(--muted); font-size:12px; }
  #help code { color:var(--fg); }
</style>
</head>
<body>
  <header>
    <img src="icons/icon32.png" alt="">
    <h1>PyDM</h1>
    <span id="status">Connexion…</span>
  </header>

  <section id="help">
    PyDM n'est pas joignable. Lancez <code>./install.sh</code> dans le dossier de PyDM,
    puis redémarrez le navigateur.
  </section>

  <div class="actions">
    <button id="page">Télécharger la vidéo</button>
    <button id="open" class="secondary">Ouvrir PyDM</button>
  </div>

  <section>
    <h2>Médias détectés</h2>
    <ul id="media"><li class="empty">Aucun pour l'instant. Lancez la lecture de la vidéo.</li></ul>
  </section>

  <section>
    <h2>Réglages</h2>
    <label class="setting">
      <input type="checkbox" id="intercept">
      <span>Intercepter les téléchargements du navigateur</span>
    </label>
    <label class="setting">
      <input type="checkbox" id="videoButton">
      <span>Afficher le bouton sur les lecteurs vidéo</span>
    </label>
    <label class="setting">
      <input type="checkbox" id="prefetch">
      <span>Préparer les vidéos à l'avance
        <span class="hint">Les qualités sont prêtes dès le clic</span>
      </span>
    </label>
    <div class="field">
      <span>Forme du bouton</span>
      <select id="videoStyle">
        <option value="long">Barre, réduite après quelques secondes</option>
        <option value="survol">Rond, allongé au survol</option>
        <option value="rond">Rond seul</option>
      </select>
    </div>
  </section>
  <script src="popup.js"></script>
</body>
</html>
